name: Deploy static site to GitHub Pages
# Remote agent configuration panel deployment: publish index.html on pushes to master

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  # Allows a one-time manual redeploy when commits were made through an integration
  # that did not start Actions; only specially prefixed issues trigger the publish job.
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.issue.title, '[deploy-pages]')) || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[deploy-pages]'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
