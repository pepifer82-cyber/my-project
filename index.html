<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A&T Printer Control</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fa;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #00000008}.row{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:180px}.muted{color:#64748b}.danger{color:#b91c1c}.ok{color:#047857}button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:#2563eb;color:#fff}.good{background:#10b981;color:#fff}.warn{background:#f59e0b;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0;font-size:14px}.hidden{display:none}.pill{padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:12px}.msg{display:block;margin-top:10px;min-height:22px}.auth-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<h1>A&T Printer Control</h1>
<div id="auth" class="card">
  <div class="row">
    <div style="flex:1;min-width:220px"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
    <div style="flex:1;min-width:220px"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div>
  </div>
  <div class="auth-actions" style="margin-top:12px">
    <button id="loginBtn" class="primary" type="button">Ingresar</button>
    <button id="signupBtn" class="secondary" type="button">Crear cuenta</button>
    <button id="testBtn" class="secondary" type="button">Probar conexión</button>
  </div>
  <span id="authMsg" class="msg muted"></span>
</div>

<div id="app" class="hidden">
  <div class="card"><button id="logoutBtn" type="button">Cerrar sesión</button> <span id="who" class="muted"></span></div>
  <div id="bootstrap" class="card hidden"><b>Cuenta sin acceso al proyecto.</b><p id="bootstrapText">La cuenta existe, pero todavía no tiene acceso al proyecto.</p></div>
  <div class="row">
    <div class="card stat"><div class="muted">Agentes</div><h2 id="agents">0</h2></div>
    <div class="card stat"><div class="muted">Online</div><h2 id="online">0</h2></div>
    <div class="card stat"><div class="muted">Impresoras</div><h2 id="printers">0</h2></div>
    <div class="card stat"><div class="muted">Última actualización</div><h2 id="last">—</h2></div>
  </div>
  <div class="card"><h2>Agentes</h2><table><thead><tr><th>Agente</th><th>Equipo</th><th>Versión</th><th>Estado</th><th>Último contacto</th><th>Acciones</th></tr></thead><tbody id="agentBody"></tbody></table></div>
  <div class="card"><h2>Impresoras</h2><table><thead><tr><th>Nombre</th><th>Fabricante</th><th>Modelo</th><th>IP</th><th>Estado</th><th>Contador</th><th>Tóner</th></tr></thead><tbody id="printerBody"></tbody></table></div>
</div>
</div>

<script>
'use strict';
const SUPABASE_URL='https://nxpdcwoypvlcgwuvjuro.supabase.co';
const SUPABASE_KEY='sb_publishable_fwz_qVPsE9lEp0v4XA1b2g_buuMHcin';
const ACCESS_KEY='atpc_access_token';
const REFRESH_KEY='atpc_refresh_token';
let projectId=null;

const $=id=>document.getElementById(id);
function setMsg(text,cls='muted'){ $('authMsg').textContent=text; $('authMsg').className='msg '+cls; }
function setBusy(b){ $('loginBtn').disabled=b; $('signupBtn').disabled=b; $('testBtn').disabled=b; }
function token(){return localStorage.getItem(ACCESS_KEY)||'';}
function saveSession(s){if(s?.access_token)localStorage.setItem(ACCESS_KEY,s.access_token);if(s?.refresh_token)localStorage.setItem(REFRESH_KEY,s.refresh_token);}
function clearSession(){localStorage.removeItem(ACCESS_KEY);localStorage.removeItem(REFRESH_KEY);projectId=null;}

async function api(path,opts={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const headers=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json'},opts.headers||{});
    if(token()) headers.Authorization='Bearer '+token();
    const res=await fetch(SUPABASE_URL+path,{...opts,headers,signal:controller.signal});
    const text=await res.text();
    let data=null; try{data=text?JSON.parse(text):null;}catch{}
    if(!res.ok){
      const message=data?.msg||data?.message||data?.error_description||data?.error||text||('HTTP '+res.status);
      const err=new Error(message); err.status=res.status; throw err;
    }
    return data;
  }catch(e){
    if(e.name==='AbortError') throw new Error('Supabase no respondió a tiempo. Revisá Internet o el bloqueador del navegador.');
    throw e;
  }finally{clearTimeout(timer);}
}

async function testConnection(){
  setBusy(true); setMsg('Probando conexión con Supabase...');
  try{
    await api('/auth/v1/settings',{method:'GET'});
    setMsg('Conexión con Supabase OK. El problema no es GitHub Pages.','ok');
  }catch(e){setMsg('Error de conexión: '+e.message,'danger');}
  finally{setBusy(false);}
}

async function login(){
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){setMsg('Ingresá correo y contraseña.','danger');return;}
  setBusy(true); setMsg('Ingresando...');
  try{
    const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
    saveSession(s); setMsg('Acceso correcto. Cargando panel...','ok'); await load();
  }catch(e){setMsg('No se pudo ingresar: '+e.message,'danger');}
  finally{setBusy(false);}
}

async function signup(){
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){setMsg('Ingresá correo y contraseña para crear la cuenta.','danger');return;}
  if(password.length<6){setMsg('La contraseña debe tener al menos 6 caracteres.','danger');return;}
  setBusy(true); setMsg('Creando cuenta...');
  try{
    const s=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});
    if(s?.access_token){saveSession(s);setMsg('Cuenta creada. Cargando panel...','ok');await load();}
    else setMsg('Cuenta creada. Revisá el correo si Supabase solicita confirmación y luego ingresá.','ok');
  }catch(e){setMsg('No se pudo crear la cuenta: '+e.message,'danger');}
  finally{setBusy(false);}
}

async function logout(){try{await api('/auth/v1/logout',{method:'POST'});}catch{}clearSession();location.reload();}

async function load(){
  if(!token()){ $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  try{
    const user=await api('/auth/v1/user',{method:'GET'});
    $('auth').classList.add('hidden'); $('app').classList.remove('hidden'); $('who').textContent=user?.email||'';
    $('bootstrap').classList.add('hidden');
    try{await api('/rest/v1/rpc/control_claim_first_owner',{method:'POST',body:'{}'});}catch(e){console.warn('bootstrap',e.message);}
    const m=await api('/rest/v1/control_project_members?select=project_id,role,active&user_id=eq.'+encodeURIComponent(user.id)+'&active=eq.true&limit=1',{method:'GET'});
    if(!Array.isArray(m)||!m.length){
      $('bootstrap').classList.remove('hidden'); $('bootstrapText').textContent='La cuenta está autenticada pero no tiene acceso al proyecto. Volvé a ingresar una vez.';
      return;
    }
    projectId=m[0].project_id; await refresh();
  }catch(e){
    clearSession(); $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); setMsg('Sesión inválida: '+e.message,'danger');
  }
}

function status(a){
  const seen=a.last_seen_at?new Date(a.last_seen_at).getTime():0, age=(Date.now()-seen)/60000;
  return !a.active?'disabled':age<=3?'online':age<=15?'stale':'offline';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function refresh(){
  if(!projectId)return;
  try{
    const [agents,printers]=await Promise.all([
      api('/rest/v1/control_agents?select=*&project_id=eq.'+encodeURIComponent(projectId)+'&order=last_seen_at.desc.nullslast'),
      api('/rest/v1/control_printers?select=*&project_id=eq.'+encodeURIComponent(projectId)+'&order=last_seen_at.desc.nullslast')
    ]);
    const a=Array.isArray(agents)?agents:[], p=Array.isArray(printers)?printers:[];
    $('agents').textContent=a.length; $('online').textContent=a.filter(x=>status(x)==='online').length; $('printers').textContent=p.length; $('last').textContent=new Date().toLocaleTimeString();
    $('agentBody').innerHTML=a.map(x=>'<tr><td><b>'+esc(x.agent_code)+'</b></td><td>'+esc(x.machine_name)+'</td><td>'+esc(x.app_version)+'</td><td><span class="pill">'+status(x)+'</span></td><td>'+(x.last_seen_at?new Date(x.last_seen_at).toLocaleString():'—')+'</td><td><button class="primary" onclick="cmd(\''+x.id+'\',\'sync_now\')">Sincronizar</button> <button class="good" onclick="cmd(\''+x.id+'\',\'rescan\')">Reescanear</button> <button class="warn" onclick="pause(\''+x.id+'\','+(status(x)==='disabled'||status(x)==='offline'?'false':'true')+')">'+(status(x)==='offline'?'Activar':'Pausar')+'</button></td></tr>').join('');
    $('printerBody').innerHTML=p.map(x=>'<tr><td>'+esc(x.display_name)+'</td><td>'+esc(x.manufacturer)+'</td><td>'+esc(x.model)+'</td><td>'+esc(x.ip_address)+'</td><td>'+esc(x.last_status)+'</td><td>'+esc(x.page_count)+'</td><td>'+esc([x.toner_black_percent!=null?'K '+Math.round(x.toner_black_percent)+'%':'',x.toner_cyan_percent!=null?'C '+Math.round(x.toner_cyan_percent)+'%':'',x.toner_magenta_percent!=null?'M '+Math.round(x.toner_magenta_percent)+'%':'',x.toner_yellow_percent!=null?'Y '+Math.round(x.toner_yellow_percent)+'%':''].filter(Boolean).join(' '))+'</td></tr>').join('');
  }catch(e){$('last').textContent='Error'; console.error(e);}
}
async function cmd(agentId,command,payload={}){
  try{await api('/rest/v1/control_agent_commands',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({project_id:projectId,agent_id:agentId,command,payload})});alert('Comando enviado');refresh();}
  catch(e){alert('Error: '+e.message);}
}
async function pause(id,on){await cmd(id,on?'disable':'enable');}

$('loginBtn').addEventListener('click',login);
$('signupBtn').addEventListener('click',signup);
$('testBtn').addEventListener('click',testConnection);
$('logoutBtn').addEventListener('click',logout);
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
load();
setInterval(refresh,10000);
</script>
</body>
</html>
