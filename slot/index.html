<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>A&T Slot</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#030303 radial-gradient(circle at 50% 18%,#353535 0,#101010 28%,#020202 72%);position:relative;overflow-x:hidden;color:#fff;min-height:100vh}body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;width:280px;height:280px;border:2px solid #777;border-radius:50%;opacity:.14;box-shadow:0 0 0 18px #222,0 0 0 20px #888,0 0 70px #fff3;top:30px}body:before{left:-190px}body:after{right:-190px}
.wrap{max-width:560px;margin:auto;padding:12px;position:relative;z-index:1}.card{background:linear-gradient(145deg,rgba(24,24,24,.98),rgba(5,5,5,.98));border:3px solid #bdbdbd;border-radius:28px;box-shadow:0 0 0 2px #555,0 0 0 5px #171717,0 25px 80px #000;padding:18px;margin:12px 0}.card:before{content:"✦  ◆  ✦  ◆  ✦  ◆  ✦";display:block;text-align:center;color:#d9d9d9;letter-spacing:10px;font-size:11px;text-shadow:0 0 8px #fff}
h1{text-align:center;font-size:38px;margin:4px 0 0;letter-spacing:2px;color:#fff;text-shadow:0 0 12px #fff8,0 3px 0 #777}.sub{text-align:center;color:#cfcfcf}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>div{background:#0b0b0b;border:1px solid #444;border-radius:13px;padding:9px}.label{font-size:11px;color:#aaa;letter-spacing:1px}.value{font-size:25px;font-weight:800}.balance{color:#f5d76e}.pool{color:#e5e5e5}.auth input,.controls input{width:100%;padding:13px;border-radius:12px;border:1px solid #555;background:#090909;color:#fff;margin:5px 0;font-size:16px}
button{border:0;border-radius:13px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{width:100%;background:linear-gradient(180deg,#f7e28a,#b88a16 52%,#6d4d09);color:#111;font-size:19px;box-shadow:inset 0 1px 0 #fff8,0 5px 18px #000}.secondary{background:linear-gradient(180deg,#555,#202020);color:#fff;border:1px solid #777}.danger{background:#991b1b;color:#fff}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}
.reels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0;padding:11px;background:linear-gradient(#111,#000);border:4px solid #aaa;border-radius:24px;box-shadow:inset 0 0 25px #000,0 0 0 2px #333,0 0 28px #fff2}.reel{height:118px;background:linear-gradient(#fff,#d7d7d7 48%,#aaa);border-radius:16px;color:#111;display:grid;place-items:center;font-size:58px;box-shadow:inset 0 3px 0 #fff,inset 0 -9px 0 #777,0 7px 15px #000;overflow:hidden}
.betbox{text-align:center}.bet{font-size:25px;font-weight:900;margin:5px}.mini{font-size:12px;color:#c4b5fd}.result{text-align:center;min-height:36px;font-weight:800}.lucky{text-align:center;background:linear-gradient(180deg,#242424,#080808);border:1px solid #888;border-radius:14px;padding:10px;margin-top:10px;color:#f2f2f2;box-shadow:inset 0 1px #fff2}.multis{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{background:#111;border:1px solid #666;border-radius:999px;padding:5px 9px;font-size:11px;color:#ddd}.win{color:#ffe37b;font-size:25px;text-shadow:0 0 12px #f5c542}.links{text-align:center;margin-top:12px}.links a{color:#67e8f9;text-decoration:none}
.msg{padding:10px;border-radius:12px;background:#3b0764;margin-top:8px;font-size:13px}.ok{background:#14532d}.err{background:#7f1d1d}
</style>
</head>
<body><div class="wrap">
<div class="card" id="authCard">
<h1>🎰 A&T SLOT</h1><div class="sub">Juego promocional con créditos virtuales</div>
<div class="auth" id="loginBox">
<input id="email" type="email" placeholder="Correo">
<input id="password" type="password" placeholder="Contraseña">
<button class="primary" onclick="login()">INICIAR SESIÓN</button>
<div class="row" style="margin-top:8px"><button class="secondary" onclick="showSignup()">CREAR USUARIO</button><button class="secondary" onclick="forgot()">RECUPERAR</button></div>
</div>
<div class="auth hidden" id="signupBox">
<input id="suName" placeholder="Nombre de usuario">
<input id="suEmail" type="email" placeholder="Correo">
<input id="suPass" type="password" placeholder="Contraseña (mín. 6)">
<button class="primary" onclick="signup()">CREAR USUARIO</button>
<button class="secondary" style="width:100%;margin-top:8px" onclick="showLogin()">VOLVER</button>
</div><div id="authMsg"></div>
</div>

<div class="card hidden" id="gameCard">
<div class="grid">
<div><div class="label">JUGADOR</div><div id="playerName" class="value">-</div></div>
<div><div class="label">CRÉDITOS</div><div id="balance" class="value balance">0 ₲</div></div>
<div><div class="label">POZO</div><div id="pool" class="value pool">0 ₲</div></div>
<div><div class="label">ÚLTIMO PREMIO</div><div id="lastWin" class="value">0 ₲</div></div>
</div>
<div class="lucky">🍀 FRUTA GANADORA: <b id="winningFruit">🍒</b> · 🃏 COMODÍN = MULTIPLICADOR</div><div class="multis"><span class="chip">x1</span><span class="chip">x2</span><span class="chip">x5</span><span class="chip">x10</span><span class="chip">x20</span><span class="chip">x50</span><span class="chip">x100</span></div><div class="reels"><div class="reel" id="r1">🍒</div><div class="reel" id="r2">🍋</div><div class="reel" id="r3">🍊</div><div class="reel" id="r4">🍉</div></div>
<div class="betbox"><div class="mini">APUESTA</div><div class="row"><button class="secondary" onclick="changeBet(-100)">−</button><div id="bet" class="bet">100 ₲</div><button class="secondary" onclick="changeBet(100)">+</button></div></div>
<button id="spinBtn" class="primary" style="margin-top:12px" onclick="spin()">🎰 PALANCA — GIRAR</button>
<div id="result" class="result"></div>
<div class="links"><button class="secondary" onclick="logout()">Salir</button> <a id="adminLink" class="hidden" href="admin.html">Consola administrativa</a></div>
</div>
</div>
<script>
const SUPABASE_URL='https://nxpdcwoypvlcgwuvjuro.supabase.co';
const SUPABASE_KEY='sb_publishable_fwz_qVPsE9lEp0v4XA1b2g_buuMHcin';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null, bet=100, spinning=false, stopRequested=false, spinTimer=null, stopAt=0;

const money=n=>new Intl.NumberFormat('es-PY').format(Number(n||0))+' ₲';
function msg(t,ok=false){document.getElementById('authMsg').innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+t+'</div>'}
function showSignup(){loginBox.classList.add('hidden');signupBox.classList.remove('hidden');authMsg.innerHTML=''}
function showLogin(){signupBox.classList.add('hidden');loginBox.classList.remove('hidden');authMsg.innerHTML=''}
async function signup(){
 const username=document.getElementById('suName').value.trim();
 const userEmail=document.getElementById('suEmail').value.trim().toLowerCase();
 const userPassword=document.getElementById('suPass').value;
 if(!username||!userEmail||userPassword.length<6)return msg('Completa usuario, correo y una contraseña de 6 caracteres o más.');
 msg('Creando usuario...',true);
 const {data,error}=await sb.auth.signUp({email:userEmail,password:userPassword,options:{data:{username:username,display_name:username}}});
 if(error)return msg('No se pudo crear: '+error.message);
 if(!data.user)return msg('Supabase no devolvió el usuario. Intenta nuevamente.');
 if(!data.session){
   return msg('USUARIO CREADO. Revisa tu correo para confirmar la cuenta y después inicia sesión. Si no llega, revisa Spam.',true);
 }
 await ensureProfile(data.user,username);
 msg('¡Usuario creado correctamente!',true);
 await loadUser();
}
async function ensureProfile(user,username){
 const {data,error}=await sb.from('slot_profiles').upsert({
   id:user.id, username:username, display_name:username
 },{onConflict:'id'}).select().single();
 if(error) throw error;
 profile=data;
}
async function login(){const userEmail=document.getElementById('email').value.trim().toLowerCase(); const userPassword=document.getElementById('password').value; const {error}=await sb.auth.signInWithPassword({email:userEmail,password:userPassword});if(error)return msg(error.message);await loadUser()}
async function forgot(){const userEmail=document.getElementById('email').value.trim().toLowerCase();if(!userEmail)return msg('Escribe tu correo primero.');const {error}=await sb.auth.resetPasswordForEmail(userEmail,{redirectTo:location.href});msg(error?error.message:'Te enviamos el enlace de recuperación.',!error)}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadUser(){
 const {data:{user}}=await sb.auth.getUser(); if(!user)return;
 const username=user.user_metadata?.username || ('jugador_'+user.id.replaceAll('-','').slice(0,8));
 try{ await ensureProfile(user,username); }catch(e){}
 const {data,error}=await sb.from('slot_profiles').select('*').eq('id',user.id).single();
 if(error){return msg('No se pudo cargar el jugador: '+error.message)}
 profile=data; authCard.classList.add('hidden');gameCard.classList.remove('hidden');
 playerName.textContent=profile.display_name||profile.username; balance.textContent=money(profile.credits);
 adminLink.classList.toggle('hidden',!profile.is_admin); await loadPool();
}
async function loadPool(){const {data}=await sb.from('slot_settings').select('jackpot_pool,min_bet,enabled,winning_symbol').eq('id',1).single();if(data){pool.textContent=money(data.jackpot_pool);document.getElementById('winningFruit').textContent=data.winning_symbol||'🍒';if(data.min_bet>100){bet=Math.max(bet,Number(data.min_bet));renderBet()}if(!data.enabled){spinBtn.disabled=true;result.textContent='Juego temporalmente desactivado.'}}}
function changeBet(delta){bet=Math.max(100,bet+delta);renderBet()}
function renderBet(){document.getElementById('bet').textContent=money(bet)}
async function spin(){
 if(!profile||spinning)return;
 spinning=true; stopRequested=false; stopAt=Date.now()+1800;
 const btn=document.getElementById('spinBtn');
 btn.disabled=false; btn.textContent='🛑 PARAR DESPACIO';
 result.textContent='🎰 ¡Girando...!';
 const els=[r1,r2,r3,r4], icons=['🍒','🍋','🍊','🍉','⭐','7️⃣','🃏'];
 const playPromise=sb.functions.invoke('slot-play',{body:{bet}});
 let finalData=null, finalError=null;
 playPromise.then(({data,error})=>{finalData=data;finalError=error});
 let delay=55, started=Date.now(), phase=0;
 function tick(){
   if(!spinning)return;
   els.forEach((e,i)=>{
     e.textContent=icons[Math.floor(Math.random()*icons.length)];
     e.animate([
       {transform:'translateY(-32px) scale(.96)',filter:'blur(1px)'},
       {transform:'translateY(18px) scale(1.03)',filter:'blur(0)'},
       {transform:'translateY(0) scale(1)',filter:'blur(0)'}
     ],{duration:Math.max(90,delay*1.5),easing:'cubic-bezier(.2,.8,.3,1)'});
   });
   const elapsed=Date.now()-started;
   if(!stopRequested && elapsed<8500){delay=55;spinTimer=setTimeout(tick,delay);return}
   stopRequested=true;
   phase++;
   delay=Math.min(520,55+phase*42);
   if(phase<13){spinTimer=setTimeout(tick,delay);return}
   finishSpin(els,playPromise);
 }
 tick();

 async function finishSpin(els,promise){
   clearTimeout(spinTimer);
   btn.disabled=true;btn.textContent='⏳ DETENIENDO...';
   const res=await promise;
   finalData=res.data;finalError=res.error;
   if(finalError){result.textContent='Error: '+(finalError.message||'No se pudo jugar');spinning=false;btn.disabled=false;btn.textContent='🎰 PALANCA — GIRAR';return}
   const x=finalData.result;
   for(let i=0;i<4;i++){
     await new Promise(r=>setTimeout(r,180+i*120));
     els[i].animate([{transform:'translateY(-10px)'},{transform:'translateY(4px)'},{transform:'translateY(0)'}],{duration:300,easing:'ease-out'});
     els[i].textContent=x.symbols[i];
   }
   profile.credits=x.balance;balance.textContent=money(x.balance);pool.textContent=money(x.jackpot_pool);lastWin.textContent=money(x.win_amount);
   if(x.win_amount>0){result.innerHTML='<div class="win">🎉 ¡PREMIO! '+money(x.win_amount)+' · '+x.multiplier+'x</div>';if(x.multiplier>=10)burst()}
   else result.textContent='Casi... probá otra combinación.';
   spinning=false;stopRequested=false;btn.disabled=false;btn.textContent='🎰 PALANCA — GIRAR';
 }
}
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN')loadUser()});
sb.auth.getSession().then(({data})=>{if(data.session)loadUser()});
function burst(){document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:500});}
renderBet();
</script></body></html>
